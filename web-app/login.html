<!DOCTYPE html>
<html>
<head><title>KimFresh Login</title></head>
<body>
<h2>KimFresh Admin Login</h2>
<p id="msg"></p>
<input type="email" id="email" placeholder="Email"><br><br>
<input type="password" id="password" placeholder="Password"><br><br>
<button onclick="login()">Login</button>

    
<script>
function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    fetch(`${window.location.protocol}//${window.location.hostname}/api/login`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: email, password: password})
    })
    .then(res => res.json())
    .then(data => {
        if (data.success && data.role === 'admin') {
            localStorage.setItem('admin', JSON.stringify(data));
            window.location.href = 'dashboard.html';
        } else {
            document.getElementById('msg').textContent = 'Login failed';
        }
    })
    .catch(err => document.getElementById('msg').textContent = 'Server error');
}
</script>
</body>
</html>
