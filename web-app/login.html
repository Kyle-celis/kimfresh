<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KimFresh - Admin Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="page">

        <div class="left">
            <img src="logo.png" alt="KimFresh" class="logo">

            <div class="left-text">
                <h1>Control everything</h1>
                <h1 class="pink">from one dashboard.</h1>
                <p>Monitor users, manage products, and monitor real-time delivery fulfillment.</p>
            </div>

            <div class="boxes">
                <div class="box">
                    <h3>Monitor</h3>
                    <p>Live deliveries</p>
                </div>
                <div class="box">
                    <h3>Manage</h3>
                    <p>Order requests</p>
                </div>
                <div class="box">
                    <h3>Monitor</h3>
                    <p>Inventory</p>
                </div>
            </div>
        </div>

        <div class="right">
            <div class="login-box">

                <div class="tabs">
                    <a href="#login" id="tabLogin" class="tab active">Login</a>
                    <!-- Note: Your backend doesn't have admin signup yet, so we hide this tab -->
                </div>

                <div id="loginPanel" class="panel">
                    <h1>Login to your account</h1>
                    <p class="subtitle">Sign in to your KimFresh admin account to continue.</p>

                    <p id="msg" class="alert-box"></p>

                    <form id="loginForm">
                        <label for="email">Email</label>
                        <div class="input-box">
                            <input type="email" id="email" placeholder="admin@kimfresh.com" autocomplete="username" required>
                        </div>

                        <label for="password">Password</label>
                        <div class="input-box">
                            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                        </div>

                        <div class="options">
                            <label class="remember">
                                <input type="checkbox" id="remember"> Remember me
                            </label>
                        </div>

                        <button type="submit" id="loginButton" class="btn">Login</button>
                    </form>
                </div>

            </div>
        </div>

    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const message = document.getElementById('msg');

        loginForm.addEventListener('submit', async function (event) {
            event.preventDefault();
            message.className = 'alert-box';
            message.textContent = '';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (email === '' || password === '') {
                message.textContent = 'Please enter your email and password.';
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = 'Logging in...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // Clear old data to prevent conflicts
                    localStorage.clear();
                    
                    // Save fresh token
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('admin', JSON.stringify(data));
                    
                    // Redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    message.textContent = data.message || 'Invalid credentials.';
                }
            } catch (err) {
                message.textContent = 'Connection error. Is the backend running?';
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
