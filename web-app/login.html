<!DOCTYPE html>
<html>
<head>
    <title>KimFresh Login</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-box">
    <h2>KimFresh Admin</h2>
    <p id="msg" class="error"></p>
    <input type="email" id="email" placeholder="Email" maxlength="100" required>
    <input type="password" id="password" placeholder="Password" minlength="6" maxlength="100" required>
    <button class="primary" onclick="login()">Login</button>
</div>

<script src="js/api.js"></script>
<script>
async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
        const data = await apiLogin(email, password);
        if (data.success) {
            localStorage.clear();
            localStorage.setItem('token', data.token);
            localStorage.setItem('admin', JSON.stringify(data));
            window.location.href = 'dashboard.html';
        } else {
            document.getElementById('msg').textContent = data.message || 'Login failed';
        }
    } catch (e) {
        document.getElementById('msg').textContent = 'Server error';
    }
}
</script>
</body>
</html>
