<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KimFresh - Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/products.css">
    <script src="js/escape.js"></script>
</head>
<body>
    <div class="dashboard-layout">

        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="logo.png" alt="KimFresh" class="logo">
                <p>Administration</p>
            </div>

            <nav class="menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="orders.html">Orders</a>
                <a href="products.html" class="active">Products</a>
                <a href="drivers.html">Drivers</a>
            </nav>
        </aside>

        <div class="main-area">

            <header class="top-header">
                <div class="profile-menu" id="profileMenu">
                    <button type="button" class="user-profile profile-trigger" aria-haspopup="true" aria-expanded="false" aria-controls="profileDropdown" onclick="toggleProfileMenu(event)">
                        <div class="avatar" id="avatar">A</div>
                        <div class="user-info">
                            <p class="user-name" id="userName">Admin</p>
                            <p class="user-role">Administrator</p>
                        </div>
                        <span class="profile-chevron" aria-hidden="true">⌄</span>
                    </button>
                    <div class="profile-dropdown" id="profileDropdown" hidden>
                        <div class="dropdown-account">
                            <span class="dropdown-account-label">SIGNED IN AS</span>
                            <strong id="dropdownUserName">Admin</strong>
                        </div>
                        <button type="button" class="logout-btn" onclick="logout()"><span aria-hidden="true">↪</span> Log out</button>
                    </div>
                </div>
            </header>

            <main class="main-content">
                <p class="overview-label">Manage</p>

                <div class="page-head">
                    <div>
                        <h1>Products</h1>
                        <p>Add, hide and keep track of your kimchi stock.</p>
                    </div>
                    <button class="primary-btn" onclick="openForm()">+ Add Product</button>
                </div>

                <div class="stats">
                    <div class="stat"><p>Total products</p><h2 id="statTotal">0</h2></div>
                    <div class="stat warn"><p>Low stock</p><h2 id="statLow">0</h2></div>
                    <div class="stat dark"><p>Hidden</p><h2 id="statHidden">0</h2></div>
                </div>

                <div class="filters">
                    <input type="text" id="searchBox"
                           placeholder="Search by name, SKU, or status..."
                           oninput="goToPage(1)">
                    <select id="productFilter" onchange="goToPage(1)">
                        <option value="active">Show Active</option>
                        <option value="low">Low Stock Only</option>
                        <option value="all">Show All (Including Hidden)</option>
                    </select>
                </div>

                <section class="table-section">
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Price</th>
                                    <th>Stock</th>
                                    <th>Reorder Level</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="productList"></tbody>
                        </table>
                    </div>
                </section>

                <div id="productPagination"></div>
            </main>

        </div>
    </div>

    <!-- Dialog for Add Product -->
    <dialog id="addDialog">
        <h2 id="pTitle">Add Product</h2>
        <p class="dialog-sub">Fill in the details of the item.</p>

        <label for="pName">Product name</label>
        <input type="text" id="pName" placeholder="e.g. Baechu Kimchi" maxlength="100">

        <div class="row">
            <div>
                <label for="pSku">SKU <span style="font-weight:400;color:#999">(optional)</span></label>
                <input type="text" id="pSku" placeholder="Auto if blank" maxlength="50">
            </div>
            <div>
                <label for="pPrice">Price (₱)</label>
                <input type="number" id="pPrice" placeholder="0.00" min="0" max="1000000" step="0.01">
            </div>
        </div>

        <div class="row">
            <div>
                <label for="pStock">Stock quantity</label>
                <input type="number" id="pStock" placeholder="0" min="0" max="1000000">
            </div>
            <div>
                <label for="pReorder">Reorder level</label>
                <input type="number" id="pReorder" placeholder="0" min="0" max="1000000">
            </div>
        </div>

        <p id="addMsg"></p>

        <div class="dialog-buttons">
            <button class="cancel-btn" onclick="closeAddForm()">Cancel</button>
            <button class="primary-btn" id="pSave" onclick="saveProduct()">Add Product</button>
        </div>
    </dialog>

    <div id="toast"></div>

    <!-- YOUR BACKEND SCRIPTS -->
    <script src="js/store.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
