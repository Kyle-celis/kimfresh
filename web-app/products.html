<!DOCTYPE html>
<html>
<head>
    <title>KimFresh - Products</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<h2>KimFresh Admin</h2>
<div class="menu">
    <a href="dashboard.html">Dashboard</a>
    <a href="orders.html">Orders</a>
    <a href="drivers.html">Drivers</a>
    <a href="products.html">Products</a>
    <a href="#" onclick="logout()">Logout</a>
</div>
<hr>

<h3>Add Product</h3>
<input type="text" id="pName" placeholder="Name" minlength="1" maxlength="100" required>
<input type="text" id="pSku" placeholder="SKU (leave blank for auto)" maxlength="50">
<input type="number" id="pPrice" placeholder="Price" min="0" max="1000000" step="0.01" required>
<input type="number" id="pStock" placeholder="Stock Quantity" min="0" max="1000000" required>
<input type="number" id="pReorder" placeholder="Reorder Level" min="0" max="1000000" required>
<button class="primary" onclick="addProduct()">Add</button>
<p id="addMsg" class="msg"></p>
<hr>

<div class="filters">
    <select id="productFilter" onchange="handleFilter()">
        <option value="active">Show Active</option>
        <option value="all">Show All (Including Hidden)</option>
    </select>
    <input type="text" id="searchBox" placeholder="Search by name, SKU, or status..." oninput="searchProducts()">
</div>

<table>
<thead>
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>SKU</th>
    <th>Price</th>
    <th>Stock</th>
    <th>Reorder Level</th>
    <th>Status</th>
    <th>Action</th>
</tr>
</thead>
<tbody id="productList"></tbody>
</table>
<div id="productPagination" class="pagination"></div>

<script src="js/escape.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/products.js"></script>
</body>
</html>
