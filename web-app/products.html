<!DOCTYPE html>
<html>
<head>
    <title>KimFresh - Products</title>
    <script src="escape.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        input[type="text"], input[type="number"] { padding: 8px; margin: 4px; }
        button { padding: 6px 12px; margin: 2px; cursor: pointer; }
        .menu { margin-bottom: 20px; }
        .menu a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
        .menu a:hover { color: #d32f2f; }
        #productPagination button {
            padding: 6px 12px; margin: 2px; cursor: pointer;
        }
    </style>
</head>
<body>
<h2>KimFresh Admin</h2>
<div class="menu">
    <a href="dashboard.html">Dashboard</a>
    <a href="orders.html">Orders</a>
    <a href="drivers.html">Drivers</a>
    <a href="products.html">Products</a>
    <a href="#" onclick="logout()">Logout</a>
</div>
<hr>

<h3>Add Product</h3>
<input type="text" id="pName" placeholder="Name" minlength="1" maxlength="100" required>
<input type="text" id="pSku" placeholder="SKU (leave blank for auto)" maxlength="50">
<input type="number" id="pPrice" placeholder="Price" min="0" max="1000000" step="0.01" required>
<input type="number" id="pStock" placeholder="Stock Quantity" min="0" max="1000000" required>
<input type="number" id="pReorder" placeholder="Reorder Level" min="0" max="1000000" required>
<button onclick="addProduct()">Add</button>
<p id="addMsg"></p>
<hr>

<div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
    <select id="productFilter" onchange="handleFilter()" style="padding: 8px; width: 200px;">
        <option value="active">Show Active</option>
        <option value="all">Show All (Including Hidden)</option>
    </select>
    <input type="text" id="searchBox" placeholder="Search by name, SKU, or status..." oninput="searchProducts()" style="width: 300px; padding: 8px;">
</div>

<table>
<thead>
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>SKU</th>
    <th>Price</th>
    <th>Stock</th>
    <th>Reorder Level</th>
    <th>Status</th>
    <th>Action</th>
</tr>
</thead>
<tbody id="productList"></tbody>
</table>
<div id="productPagination" style="margin-top:20px; text-align:center;"></div>

<script>
const API = `${window.location.protocol}//${window.location.hostname}`;
const token = localStorage.getItem('token');
const authHeaders = {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${token}`
};
const admin = JSON.parse(localStorage.getItem('admin'));

if (!admin || admin.role !== 'admin') window.location.href = 'login.html';

let allProducts = [];
let currentProductPage = 1;
const PRODUCTS_PER_PAGE = 10;

function logout() {
    localStorage.clear();
    window.location.href = 'login.html';
}

function addProduct() {
    const body = {
        name: document.getElementById('pName').value,
        sku: document.getElementById('pSku').value,
        unit_price: document.getElementById('pPrice').value,
        stock_quantity: document.getElementById('pStock').value,
        reorder_level: document.getElementById('pReorder').value
    };
    fetch(`${API}/api/products`, {
        method: 'POST',
        headers: authHeaders,
        body: JSON.stringify(body)
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('addMsg').textContent = data.message;
        loadProducts();
    });
}

function loadProducts() {
    fetch(`${API}/api/products`)
        .then(res => res.json())
        .then(data => { allProducts = data; currentProductPage = 1; renderProducts(data); });
}

function loadAllProducts() {
    fetch(`${API}/api/products/all`)
        .then(res => res.json())
        .then(data => { allProducts = data; currentProductPage = 1; renderProducts(data); });
}

function renderProducts(products) {
    const totalPages = Math.max(1, Math.ceil(products.length / PRODUCTS_PER_PAGE));
    if (currentProductPage > totalPages) currentProductPage = totalPages;

    const start = (currentProductPage - 1) * PRODUCTS_PER_PAGE;
    const pageItems = products.slice(start, start + PRODUCTS_PER_PAGE);

    const list = document.getElementById('productList');
    list.innerHTML = '';
    if (pageItems.length === 0) {
        list.innerHTML = '<tr><td colspan="8">No products found</td></tr>';
    } else {
        pageItems.forEach(p => {
            let action = p.status === 'available'
                ? `<button onclick="hideProduct(${p.product_id})">Hide</button>`
                : `<button onclick="restoreProduct(${p.product_id})">Restore</button>`;
            list.innerHTML += `<tr>
                <td>${escapeHtml(p.product_id)}</td>
                <td>${escapeHtml(p.name)}</td>
                <td>${escapeHtml(p.sku)}</td>
                <td>${escapeHtml(p.unit_price)}</td>
                <td>${escapeHtml(p.stock_quantity || 0)}</td>
                <td>${escapeHtml(p.reorder_level)}</td>
                <td>${escapeHtml(p.status)}</td>
                <td>${action}</td>
            </tr>`;
        });
    }

    renderProductPagination(totalPages);
    window._currentProducts = products;
}

function renderProductPagination(totalPages) {
    const el = document.getElementById('productPagination');
    if (totalPages <= 1) {
        el.innerHTML = '';
        return;
    }

    let html = '';
    if (currentProductPage > 1) {
        html += `<button onclick="goToProductPage(${currentProductPage - 1})">◀ Prev</button>`;
    }

    for (let i = 1; i <= totalPages; i++) {
        if (i === currentProductPage) {
            html += `<button style="background:#d32f2f;color:white;font-weight:bold;">${i}</button>`;
        } else {
            html += `<button onclick="goToProductPage(${i})">${i}</button>`;
        }
    }

    if (currentProductPage < totalPages) {
        html += `<button onclick="goToProductPage(${currentProductPage + 1})">Next ▶</button>`;
    }

    el.innerHTML = html;
}

function goToProductPage(page) {
    currentProductPage = page;
    renderProducts(window._currentProducts || []);
}

function handleFilter() {
    currentProductPage = 1;
    document.getElementById('productFilter').value === 'all' ? loadAllProducts() : loadProducts();
}

function hideProduct(id) {
    if (!confirm('Hide this product?')) return;
    fetch(`${API}/api/products/${id}/hide`, {
        method: 'PUT',
        headers: authHeaders
    })
        .then(res => res.json()).then(data => { alert(data.message); loadProducts(); });
}

function restoreProduct(id) {
    fetch(`${API}/api/products/${id}/restore`, {
        method: 'PUT',
        headers: authHeaders
    })
        .then(res => res.json()).then(data => { alert(data.message); loadAllProducts(); });
}

function searchProducts() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    const filtered = allProducts.filter(p =>
        p.name.toLowerCase().includes(q) ||
        p.sku.toLowerCase().includes(q) ||
        p.status.toLowerCase().includes(q)
    );
    currentProductPage = 1;
    renderProducts(filtered);
}

loadProducts();
setInterval(() => {
    const filter = document.getElementById('productFilter').value;
    if (filter === 'all') {
        loadAllProducts();
    } else {
        loadProducts();
    }
}, 10000);
</script>
</body>
</html>
