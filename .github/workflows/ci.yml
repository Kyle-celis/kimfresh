name: PHP Syntax Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: PHP ${{ matrix.php }} Syntax Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify critical files exist
        run: |
          set -e
          for f in \
            php-web/core/Controller.php \
            php-web/core/Model.php \
            php-web/core/Csrf.php \
            php-web/public/index.php \
            php-web/config/db.php \
            php-web/app/helpers/log_helper.php
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing critical file: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: PHP syntax check (all .php files)
        run: |
          set -e
          fail=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=$file::Syntax error detected"
              php -l "$file"
              fail=1
            fi
          done < <(find php-web -type f -name '*.php' \
              -not -path '*/lib/fpdf/*' \
              -not -name '*.bak' \
              -not -name '*.bak2' \
              -not -name '*.p2bak' \
              -not -name '*.p5bak')
          exit $fail